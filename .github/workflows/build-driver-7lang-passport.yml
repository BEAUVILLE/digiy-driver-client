name: Construire DRIVER 7 langues complet

on:
  push:
    branches:
      - feature/driver-7lang-full-passport
    paths:
      - tools/install_driver_full_language_passport.py
      - .github/workflows/build-driver-7lang-passport.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la branche pilote
        uses: actions/checkout@v4
        with:
          ref: feature/driver-7lang-full-passport
          fetch-depth: 0

      - name: Installer le parcours complet
        run: python3 tools/install_driver_full_language_passport.py

      - name: Contrôler le module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          i18n = Path('assets/driver-i18n-full.js').read_text(encoding='utf-8')
          nav = Path('assets/driver-language-navigation-fix.js').read_text(encoding='utf-8')

          assert '20260731-driver7-passport-v1' in index
          assert '20260731-driver7-passport-v1' in nav
          assert 'DIGIY DRIVER FULL LANGUAGE PASSPORT v1' in i18n
          assert 'function propagateLanguage(root)' in i18n
          assert 'function applySeo()' in i18n
          for code in ('fr','en','es','de','it','nl','ar'):
              assert code in i18n
          print('Contrôles DRIVER validés')
          PY
          node --check assets/driver-i18n-full.js
          node --check assets/driver-language-navigation-fix.js

      - name: Publier uniquement sur la branche pilote
        run: |
          if git diff --quiet -- index.html assets/driver-i18n-full.js assets/driver-language-navigation-fix.js; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "DIGIYLYFE Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/driver-i18n-full.js assets/driver-language-navigation-fix.js
          git commit -m "DRIVER : conserver les 7 langues sur tout le parcours"
          git push origin HEAD:feature/driver-7lang-full-passport
